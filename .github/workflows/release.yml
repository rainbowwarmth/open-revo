name: Release & Cloud Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Never cancel an in-flight release: a half-published release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: '9.15.9'
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm must be installed before setup-node so its pnpm store cache can be resolved.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Hardware Vault Gatekeeper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gatekeeper = "./scripts/check_vault_leaks.ps1"
          if (Test-Path -LiteralPath $gatekeeper) {
              Write-Host "[*] Running Vault Leak Gatekeeper..." -ForegroundColor Cyan
              & $gatekeeper
              if ($LASTEXITCODE -ne 0) { throw "Vault leak gatekeeper failed with exit code $LASTEXITCODE" }
          } else {
              Write-Host "[!] $gatekeeper not present in checkout (excluded by .gitignore), skipping gate." -ForegroundColor Yellow
          }

      # Fail fast on TypeScript / Vite errors instead of burning 10+ minutes of Rust compilation.
      - name: Type-check & Build Frontend
        run: pnpm build

      # Single compile pass: produces target/release/open-revo.exe plus the NSIS installer.
      # bundle.active/targets are declared in src-tauri/tauri.conf.json; --bundles keeps it explicit.
      - name: Build Executable & NSIS Installer
        run: pnpm tauri build --bundles nsis

      # ------------------------------------------------------------------------
      # [Open Source Code Signing Hook - Reserved for SignPath / Trusted Signing]
      # When approved for free open source signing, insert the signing action here:
      # - name: Sign Executable & Installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     ...
      # ------------------------------------------------------------------------

      - name: Prepare Artifacts & Calculate Hashes
        id: prepare_artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$ver-dev" }
          $commit = (git rev-parse --short HEAD).Trim()
          Write-Host "Version: $ver | Tag: $tag | Commit: $commit" -ForegroundColor Green

          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 1. Standalone executable
          $srcExe = "src-tauri/target/release/open-revo.exe"
          if (-not (Test-Path -LiteralPath $srcExe)) {
              throw "Build output missing: $srcExe"
          }
          $destExe = Join-Path $distDir "open-revo.exe"
          Copy-Item -LiteralPath $srcExe -Destination $destExe -Force
          Write-Host "[OK] Executable: open-revo.exe" -ForegroundColor Cyan

          # 2. Portable archive
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
              $candidate = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
              if (Test-Path -LiteralPath $candidate) { $sevenZip = $candidate }
          }
          if (-not $sevenZip) { throw "7-Zip not found on runner, cannot build portable archive" }

          $portableName = "OpenRevo-${tag}-portable.7z"
          $dest7z = Join-Path $distDir $portableName
          & $sevenZip a -t7z -mx=9 $dest7z $destExe | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $dest7z)) {
              throw "7-Zip archive creation failed with exit code $LASTEXITCODE"
          }
          Write-Host "[OK] Portable: $portableName" -ForegroundColor Cyan

          # 3. NSIS installer (hard requirement: never silently publish an exe-only release)
          $nsisSourceDir = "src-tauri/target/release/bundle/nsis"
          $matchedNsis = Get-ChildItem -Path $nsisSourceDir -Filter "*.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $matchedNsis) {
              throw "NSIS installer not found under $nsisSourceDir. Check 'tauri build --bundles nsis' output."
          }
          $installerName = "OpenRevo-${tag}-x64-Setup.exe"
          $destInstaller = Join-Path $distDir $installerName
          Copy-Item -LiteralPath $matchedNsis.FullName -Destination $destInstaller -Force
          Write-Host "[OK] Installer: $installerName" -ForegroundColor Cyan

          # 4. SHA256 checksums
          $checksumFile = Join-Path $distDir "checksums.txt"
          if (Test-Path -LiteralPath $checksumFile) { Remove-Item -LiteralPath $checksumFile -Force }
          Get-ChildItem -Path $distDir -File | Where-Object { $_.Name -ne "checksums.txt" } |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
                  "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
              }

          Write-Host "=== Release Artifacts ===" -ForegroundColor Green
          Get-ChildItem -Path $distDir -File | Format-Table Name, Length -AutoSize
          Get-Content $checksumFile

          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Build Artifacts (Workflow Storage)
        uses: actions/upload-artifact@v4
        with:
          name: open-revo-artifacts-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: dist_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release (Tag / Dispatch)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft == true
        with:
          name: OpenRevo ${{ steps.prepare_artifacts.outputs.tag_name }}
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          files: dist_artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
